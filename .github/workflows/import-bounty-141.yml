name: Import tested bounty 141 branch

on:
  push:
    branches:
      - bounty/141-private-follow-and-tab-sync

permissions:
  contents: write

jobs:
  import:
    if: "!contains(github.event.head_commit.message, '[imported]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import tested implementation
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch bounty/141-112-private-follow-and-tab-sync https://github.com/cornerblue/jumble.git "$tmp/source"
          rsync -a --delete --exclude=.git "$tmp/source/" "$GITHUB_WORKSPACE/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[imported] bounty 141 implementation"
          git push origin HEAD:bounty/141-private-follow-and-tab-sync
